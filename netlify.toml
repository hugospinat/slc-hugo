[build]
  publish = "public"
  command = "hugo"

[context.production.environment]
  HUGO_VERSION = "0.148.1"  # (ou celle que tu veux, ex: 0.111.3)

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400, immutable"

[[redirects]]
  from = "https://adhesions.slc.asso.fr/*"
  to = "https://slc.asso.fr/menu/adh%C3%A9sions/"
  status = 301
  force = true
